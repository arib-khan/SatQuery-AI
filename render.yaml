services:
  - type: web
    name: satquery-ai-backend
    env: python
    buildCommand: >
      pip install torch==2.5.1+cpu --index-url https://download.pytorch.org/whl/cpu &&
      pip install -r requirements-production.txt
    startCommand: python -m uvicorn src.satquery.api.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: SATQUERY_FORCE_CPU
        value: "1"
      - key: SATQUERY_LOAD_GRADIO
        value: "0"
      - key: PYTHONPATH
        value: /opt/render/project/src:/opt/render/project/src/src
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: inclusionai/ling-3.0-flash-vl:free
